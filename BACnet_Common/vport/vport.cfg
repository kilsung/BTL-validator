# ModbusRTU Multi-Master Hub Configuration File

# Slave Response Timeout in Milliseconds
DEFAULT_SLAVE_TIMEOUT_MS=500

# Maximum Number of Master Ports
# select() uses FD_SETSIZE (typically 1024), so this value must not
# exceed a safe limit.  Each master creates 1 PTY pair (2 FDs).
# Default: 32 (conservative limit for embedded targets)
MAX_MASTERS=32

# Maximum Request Queue Depth
# When the queue exceeds this limit, new requests are rejected with
# a Modbus exception response (Server Device Busy, code 0x06).
# A value of 0 means "auto" (= MAX_MASTERS, since each master can
# have at most 1 outstanding request in normal operation).
MAX_QUEUE_DEPTH=0
